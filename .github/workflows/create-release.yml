name: Create Release

on:
  push:
    tags:
      - v[0-9]+*

jobs:

  create-release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir build
          cd build
          for arch in amd64 arm64; do
            go build -v -trimpath -ldflags='-s -w -buildid=' \
              -o="netexp-linux-$arch" ./cmd/netexp
          done
          sha256sum -- * > sha256sums.txt

      - name: Create release
        run: |
          tag=$GITHUB_REF_NAME
          gh release create --generate-notes --title="$tag" -- "$tag" build/*
