name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - v**

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Build
        run: |
          mkdir -p dist
          go build -v -o dist/netexp-linux-amd64 ./cmd/netexp

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/netexp-linux-amd64
          generate_release_notes: true
